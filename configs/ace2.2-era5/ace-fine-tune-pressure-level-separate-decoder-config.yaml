# ACE2.2-ERA5 pressure-level-decoder fine-tune.
#
# Trains a secondary MLP decoder for the AIMIP pressure-level diagnostics on top of
# the FROZEN ACE2.2-ERA5 core (1-deg daily-06Z v2 ERA5-only recipe, non-residual,
# no CO2; wandb ai2cm/ace/nobgd4ek, beaker dataset 01KXKBKW2DCAYX6Q3FRJ60K3Q6). The
# stepper.step.config block is that run's EXACT training block (the frozen core);
# only the secondary_decoder and the data/stats paths are ours.
#
# DECODER TARGETS = 27, the AIMIP evaluation spec (EVALUATION_PRESSURE_LEVELS):
# ta/hus/ua/va at 1000/850/700/500/250/100/50 hPa. ta@850 and zg@500 are OMITTED
# because the frozen core already outputs TMP850 and h500; the AIMIP submission
# assembles the full ta profile from core TMP850 + decoder ta, and zg is 500-only.
#
# DATA. The plev target is a daily-06Z companion derived from the SAME 6-hourly
# source as the core (2026-03-19-era5-1deg-8layer-1940-2025.zarr) by
# run-ace2.2-build-plev-companion.sh -> co-extensive with the core (1940-2025),
# same grid/pipeline, mutually consistent. train/val/inference all MERGE the core
# zarr with this companion; because both share an identical daily-06Z time axis the
# merge is valid everywhere (this is why inline inference now scores all targets and
# best_inference_error is finite, unlike an earlier core-only-inference attempt).
# /statsdata is the merged core+plev stats dataset (companion build's result dataset).
#
# ADAPTATIONS vs the ACE2.1 (6-hourly) fine-tune: daily timestep (n_forward_steps
# 7300->1825 for the 5-year inline rollout; stepper_training.n_forward_steps 2->1 to
# match this core's pretraining); LR-warmup total_iters 13695->3425 for the daily
# sample count; log_histograms false (histogram aggregation is unused here and its
# empty-tensor path errored). Checkpoint selection and early stopping are
# inference-error-based (standard), enabled by the co-extensive merge above.
experiment_dir: /results
save_checkpoint: true
validate_using_ema: true
max_epochs: 120
seed: 0
ema:
  decay: 0.999
checkpoint_every_n_batches: 5000
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ace
  entity: ai2cm
train_loader:
  batch_size: 16
  num_data_workers: 4
  prefetch_factor: 4
  dataset:
    merge:
    - data_path: /climate-default/2026-03-19-era5-1deg-8layer-daily-1940-2025.zarr
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1979-01-01'
        stop_time: '2008-12-31'
    - data_path: /climate-default/2026-08-06-era5-1deg-plev-daily-06z-1940-2025
      file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
      engine: zarr
      subset:
        start_time: '1979-01-01'
        stop_time: '2008-12-31'
validation:
  loader:
    batch_size: 128
    num_data_workers: 4
    prefetch_factor: 4
    dataset:
      merge:
      - data_path: /climate-default/2026-03-19-era5-1deg-8layer-daily-1940-2025.zarr
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2009-01-01'
          stop_time: '2014-12-31'
          step: 3
      - data_path: /climate-default/2026-08-06-era5-1deg-plev-daily-06z-1940-2025
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
        subset:
          start_time: '2009-01-01'
          stop_time: '2014-12-31'
          step: 3
inference:
  n_forward_steps: 1825
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
      - '2009-01-01T06:00:00'
      - '2009-02-15T06:00:00'
      - '2009-04-01T06:00:00'
      - '2009-05-15T06:00:00'
      - '2009-07-01T06:00:00'
      - '2009-08-15T06:00:00'
      - '2009-10-01T06:00:00'
      - '2009-11-15T06:00:00'
    dataset:
      merge:
      - data_path: /climate-default/2026-03-19-era5-1deg-8layer-daily-1940-2025.zarr
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
      - data_path: /climate-default/2026-08-06-era5-1deg-plev-daily-06z-1940-2025
        file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
        engine: zarr
    num_data_workers: 4
  aggregator:
    log_histograms: false
    time_mean_reference_data: /statsdata/time-mean.nc
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
  scheduler:
    schedulers:
    - type: LinearLR
      step_each_iteration: true
      kwargs:
        start_factor: 0.01
        end_factor: 1
        total_iters: 3425
    - type: ConstantLR
      step_each_iteration: true
    milestones:
    - 3425
stepper_training:
  n_forward_steps: 1
  loss:
    type: MSE
    weights:
      air_temperature_0: 0.5
      air_temperature_1: 0.5
      eastward_wind_0: 0.5
      northward_wind_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      PRATEsfc: 0.5
      DLWRFsfc: 2
      ULWRFsfc: 5
      USWRFsfc: 2
      DSWRFsfc: 2
      USWRFtoa: 2
      tendency_of_total_water_path_due_to_advection: 0.5
  parameter_init:
    weights_path: /base_weights/ckpt.tar
    parameters:
    - frozen:
        include:
        - '*'
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 512
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          affine_norms: true
          normalize_big_skip: true
          filter_num_groups: 16
          spectral_ratio: 0.125
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          clip_latent_global_means: true
      normalization:
        network:
          global_means_path: /statsdata/centering.nc
          global_stds_path: /statsdata/scaling-full-field.nc
        residual:
          global_means_path: /statsdata/centering.nc
          global_stds_path: /statsdata/scaling-residual.nc
      ocean:
        surface_temperature_name: surface_temperature
        ocean_fraction_name: ocean_fraction
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - Q2m
        - PRATEsfc
        - ULWRFsfc
        - ULWRFtoa
        - DLWRFsfc
        - DSWRFsfc
        - USWRFsfc
        - USWRFtoa
      next_step_forcing_names:
      - DSWRFtoa
      in_names:
      - land_fraction
      - ocean_fraction
      - sea_ice_fraction
      - DSWRFtoa
      - HGTsfc
      - PRESsfc
      - surface_temperature
      - TMP2m
      - Q2m
      - UGRD10m
      - VGRD10m
      - air_temperature_0
      - air_temperature_1
      - air_temperature_2
      - air_temperature_3
      - air_temperature_4
      - air_temperature_5
      - air_temperature_6
      - air_temperature_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - eastward_wind_0
      - eastward_wind_1
      - eastward_wind_2
      - eastward_wind_3
      - eastward_wind_4
      - eastward_wind_5
      - eastward_wind_6
