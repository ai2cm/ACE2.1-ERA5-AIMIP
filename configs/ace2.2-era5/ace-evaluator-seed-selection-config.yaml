# ACE2.2-ERA5 seed selection: seven 5-year rollouts, starting 1 Jan. of 1980, 1985, ..., 2010.
#
# As for ACE2.1-ERA5, the seed was chosen from two evaluator runs per seed, on the stage-2
# checkpoints: one 36-year rollout from a single initial condition
# (ace-evaluator-seed-selection-single-config.yaml) and seven 5-year rollouts spread across
# 1980-2010 (ace-evaluator-seed-selection-config.yaml). Both match ACE2.1's
# configs/ace-evaluator-seed-selection*.yaml in the number and placement of initial
# conditions and the rollout length. They differ in the ERA5 store, which is the 2026-03-19
# build the ACE2.2 checkpoints were trained on, and in the aggregator block, which is written
# in the current config schema and logs the same metrics. Both rollouts end 2014-12-31 and
# never enter the 2015-2024 holdout.
#
# The checkpoint is mounted at /ckpt.tar by scripts/run-ace2.2-6h-seed-selection.sh. The
# config sets no `seed`, so each run draws its own noise from these noise-conditioned
# models; set one for any new set of runs generated together.
checkpoint_path: /ckpt.tar
experiment_dir: /results
logging:
  project: ace
n_forward_steps: 7300
forward_steps_in_memory: 40
loader:
  start_indices:
    times:
    - '1980-01-01T00:00:00'
    - '1985-01-01T00:00:00'
    - '1990-01-01T00:00:00'
    - '1995-01-01T00:00:00'
    - '2000-01-01T00:00:00'
    - '2005-01-01T00:00:00'
    - '2010-01-01T00:00:00'
  dataset:
    data_path: /climate-default/
    file_pattern: 2026-03-19-era5-1deg-8layer-1940-2025.zarr
    engine: zarr
  num_data_workers: 4
data_writer:
  save_prediction_files: false
  save_monthly_files: false
aggregator:
  step_means: []
  ensembles: []
  mean_denorm:
    enabled: false
    target: denorm
  mean_norm:
    enabled: false
    target: norm
  zonal_mean:
    enabled: false
  time_mean_denorm:
    target: denorm
    variables: &id001
    - PRATEsfc
    - TMP2m
    - Q2m
    - UGRD10m
    - VGRD10m
    - h500
    - TMP850
    - PRESsfc
    - surface_temperature
    - ULWRFsfc
    - DLWRFsfc
    - USWRFsfc
    - DSWRFsfc
    - ULWRFtoa
    - USWRFtoa
    - LHTFLsfc
    - SHTFLsfc
    - tendency_of_total_water_path_due_to_advection
    - air_temperature_0
    - air_temperature_1
    - air_temperature_3
    - air_temperature_7
    - specific_total_water_0
    - specific_total_water_1
    - specific_total_water_3
    - specific_total_water_7
    - eastward_wind_0
    - eastward_wind_1
    - eastward_wind_3
    - eastward_wind_7
    - northward_wind_0
    - northward_wind_1
    - northward_wind_3
    - northward_wind_7
    - total_water_path
  time_mean_norm:
    target: norm
    variables: *id001
  annual:
    variables: *id001
  power_spectrum:
    variables: *id001
  histogram:
    enabled: true
